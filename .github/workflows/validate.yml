name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --maxWorkers=2
      - run: npm run build
      - name: Verify committed release artifacts
        run: |
          git diff --exit-code -- dist package.json
          if [ -n "$(git ls-files --others --exclude-standard -- dist)" ]; then
            echo "Build produced release files that are missing from the tag"
            git ls-files --others --exclude-standard -- dist
            exit 1
          fi

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-09-25; latest tag 22.5.0 is from 2022
        with:
          category: plugin
