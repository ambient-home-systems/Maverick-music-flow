name: Feature request
description: Share a usability insight or a focused feature suggestion.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe your use case and the current difficulty.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
  - type: input
    id: card_version
    attributes:
      label: Maverick Music card version
  - type: input
    id: engine_version
    attributes:
      label: Maverick Music Engine version
  - type: input
    id: ma_version
    attributes:
      label: Music Assistant version
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
